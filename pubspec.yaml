publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Optional: For quick declarative animations
  flutter_animate: ^4.5.0
  http: ^1.6.0
